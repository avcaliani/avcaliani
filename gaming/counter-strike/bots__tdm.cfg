// ===========================================================
// CS2 Offline Team Deathmatch with Bots
// File: bots__tdm.cfg
//
// Place this file in:
// C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg
//
// Usage:
// 1. Launch an offline Practice game.
// 2. Choose Deathmatch.
// 3. Open the console (~).
// 4. Type:
//      exec bots__tdm
// ===========================================================

// -----------------------------
// Team Deathmatch
// 0 = Team Deathmatch
// 1 = Free For All
// -----------------------------
mp_teammates_are_enemies 0

// -----------------------------
// Instant respawns
// -----------------------------
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1

// -----------------------------
// Spawn players around the map
// -----------------------------
mp_randomspawn 1

// -----------------------------
// Prevent auto team balancing
// -----------------------------
mp_limitteams 0
mp_autoteambalance 0

// -----------------------------
// Bots
// -----------------------------
bot_quota 13             // Total number of bots
bot_difficulty 3         // 0 Easy, 1 Normal, 2 Hard, 3 Expert

// -----------------------------
// Faster gameplay
// -----------------------------
mp_freezetime 0
mp_roundtime 60

// -----------------------------
// Optional quality-of-life
// -----------------------------
mp_buy_anywhere 1
mp_buytime 9999

// Restart so all settings apply
mp_restartgame 1

echo "==========================================="
echo " Offline Team Deathmatch Loaded!"
echo " Type 'bot_add_ct' or 'bot_add_t' if needed."
echo "==========================================="
